<body>
<canvas id="c"></canvas>
<script>
// =====================  CONFIGURACIÓN  =====================
const CONFIG = {
  width: 1080, height: 1350,       // 1080x1080 post · 1080x1350 vertical · 1080x1920 reel/story
  bpm: 170,                         // salsa: 160–200
  drawFps: 12,                      // dibujos por segundo (12 = "a doses", look stop-motion)
  routine: ['basico', 'vueltaChica', 'basico', 'acrobacia'], // un compás de 8 tiempos por paso
  title: '',                        // texto a mano arriba, p. ej. 'Son Salseros'
  subtitle: '',                     // segunda línea opcional
  showCounts: true,                 // números 1-8 abajo marcando el tiempo
  notes: true,                      // notas musicales flotando
  paper: [244, 239, 227],           // color del papel (RGB)
  graphite: [44, 44, 52],           // color del lápiz (RGB)
  figureScale: 1.18,                // tamaño de los muñequitos (1.18 cuadrado · 1.6 reel 1080x1920)
  logo: true,                       // logo de la academia pasado a carboncillo, arriba
  logoWidth: 440,                   // ancho del logo en px
  logoTop: 34,                      // distancia desde el borde de arriba
  font: "'Caveat','Patrick Hand','Noteworthy','Marker Felt','Comic Sans MS',cursive",
};

// =====================  MOTOR  =====================
const W = CONFIG.width, H = CONFIG.height;
const cv = document.getElementById('c'); cv.width = W; cv.height = H;
const ctx = cv.getContext('2d');
const U = Math.min(W, H) / 1080;          // unidad de escala
const CX = W / 2;
const G = H - 260 * U;                     // línea del suelo
const BPS = CONFIG.bpm / 60;
const LOOP_SECONDS = CONFIG.routine.length * 8 / BPS;

// ---- utilidades y azar determinista (mismo fotograma = mismo dibujo) ----
function rnd(...k) {
  let h = 2166136261 >>> 0;
  for (const v of k) { h = Math.imul(h ^ (Math.floor(v) | 0), 16777619); h ^= h >>> 15; }
  h = Math.imul(h ^ (h >>> 13), 0x5bd1e995); h ^= h >>> 15;
  return (h >>> 0) / 4294967296;
}
const jit = (...k) => rnd(...k) * 2 - 1;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const lerp2 = (p, q, t) => [lerp(p[0], q[0], t), lerp(p[1], q[1], t)];
const add = (p, q) => [p[0] + q[0], p[1] + q[1]];
const smooth = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const ramp = (x, a, b) => smooth((x - a) / (b - a));

// ---- papel ----
const paper = document.createElement('canvas'); paper.width = W; paper.height = H;
(function () {
  const p = paper.getContext('2d');
  const img = p.createImageData(W, H), d = img.data, [r, g, b] = CONFIG.paper;
  for (let i = 0, n = W * H; i < n; i++) {
    const x = i % W, y = (i / W) | 0;
    const v = (rnd(x, y, 3) - 0.5) * 9 + (rnd(x >> 3, y, 7) - 0.5) * 5;
    d[i * 4] = r + v; d[i * 4 + 1] = g + v; d[i * 4 + 2] = b + v * 1.1; d[i * 4 + 3] = 255;
  }
  p.putImageData(img, 0, 0);
  const vg = p.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.78);
  vg.addColorStop(0, 'rgba(120,100,70,0)'); vg.addColorStop(1, 'rgba(120,100,70,0.17)');
  p.fillStyle = vg; p.fillRect(0, 0, W, H);
})();
const PAPER = ctx.createPattern(paper, 'no-repeat');

// ---- grano de grafito (textura del trazo) ----
const grainC = document.createElement('canvas'); grainC.width = grainC.height = 128;
(function () {
  const g = grainC.getContext('2d'), img = g.createImageData(128, 128), [r, gg, b] = CONFIG.graphite;
  for (let i = 0; i < 128 * 128; i++) {
    img.data[i * 4] = r; img.data[i * 4 + 1] = gg; img.data[i * 4 + 2] = b;
    img.data[i * 4 + 3] = 255 * (0.3 + 0.7 * Math.pow(rnd(i, 11), 0.55));
  }
  g.putImageData(img, 0, 0);
})();

// ---- trazos a lápiz ----

// ---- cinemática ----
function ik(a, b, l1, l2, bend) {   // 2 huesos: devuelve [articulación, extremo]

const BODY = { thigh: 104, shin: 100, torso: 150, neck: 16, head: 31, upper: 100, fore: 96, foot: 26 };
const FIG = CONFIG.figureScale;

const MOVES = {
  basico:      { spin: null, scale: { L: [1, 1],  F: [1, 1] } },
  vueltaChica: { spin: 'F',  scale: { L: [1, .4], F: [1, .3] } },
  vueltaChico: { spin: 'L',  scale: { L: [1, .3], F: [1, .8] } },
  acrobacia:   { spin: null, acro: true, scale: { L: [1, .15], F: [.8, 0] } },
};

function timeline(t) {
  const beat = t * BPS, bar = Math.floor(beat / 8);
  const move = MOVES[CONFIG.routine[bar % CONFIG.routine.length]] || MOVES.basico;
  const cnt = beat - bar * 8, c = Math.min(7, Math.floor(cnt)), f = cnt - c;

}

// ---- acrobacia: agarre a la cintura, levantada, voltereta hacia atrás y aterrizaje ----
const FLIP_A = 4.9, FLIP_B = 7.0;

  const c = tl.cnt;

  const pr = clamp((c - FLIP_A) / (FLIP_B - FLIP_A), 0, 1);

    grip: ramp(c, 2.8, 3.8) * (1 - ramp(c, 7.5, 8)),          // se juntan y él la agarra
    air:  ramp(c, 4.0, 5.0) * (1 - ramp(c, 7.0, 7.8)),         // altura de la levantada

    flipK: pr > 0 && pr < 1 ? Math.sin(Math.PI * pr) : 0,      // intensidad del giro (para las líneas)

  const liftY = isL ? 0 : 220 * U * FIG * AC.air;

  const hx = CX + (isL ? -1 : 1) * 110 * U * FIG + v(PAT.Hp) + shiftX;
  const heel = isL ? 4 * U : 10 * U;

    const toe = isL ? [ankle[0] + dir * B.foot * k, ankle[1] + heel] : [ankle[0] + dir * 24 * k, ankle[1] + heel];

    legA, legB,

  for (let p = 0; p < 2; p++) {
    ctx.globalAlpha = a * (p ? 0.4 : 1);
    ctx.fillText(str, CX + jit(BOIL, size, p, 1) * 1.6 * U, y + jit(BOIL, size, p, 2) * 1.6 * U);
  }
  ctx.restore();
}
function drawCounts(tl) {
  const y = G + 112 * U, gap = 66 * U, x0 = CX - gap * 3.5;
  for (let i = 0; i < 8; i++) {
    const cur = i === tl.c, pause = i === 3 || i === 7;
    ctx.save(); ctx.fillStyle = PENCIL; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.globalAlpha = cur ? 0.95 : (pause ? 0.16 : 0.34);
    ctx.font = `700 ${(cur ? 66 : 42) * U}px ${CONFIG.font}`;
    ctx.fillText(String(i + 1), x0 + gap * i + jit(BOIL, i, 41) * 1.2 * U, y + jit(BOIL, i, 42) * 1.2 * U);
    ctx.restore();
    if (cur) pencil([[x0 + gap * i - 20 * U, y + 38 * U], [x0 + gap * i + 22 * U, y + 35 * U]], { w: 3, a: 0.7, over: 4 });
  }
}

// ---- fotograma ----
function renderAt(t) {
  t = ((t % LOOP_SECONDS) + LOOP_SECONDS) % LOOP_SECONDS;
  const frame = Math.floor(t * CONFIG.drawFps + 1e-6), tq = frame / CONFIG.drawFps;
  BOIL = frame; SID = 0;
  const tl = timeline(tq);
  CUR_BEAT = tl.beat;
  ctx.globalAlpha = 1; ctx.drawImage(paper, 0, 0);
  drawGround();
  drawLogo();

  const L = buildFigure('L', tq, tl), F = buildFigure('F', tq, tl);
  // agarres: cercano = mano dcha. de él + izq. de ella · lejano = izq. de él + dcha. de ella
  const r = raiseAmt(tl);
  const lowNear = [(L.shNear[0] + F.shNear[0]) / 2, (L.hip[1] + F.hip[1]) / 2 - 80 * U * FIG];
  const lowFar = [lowNear[0] + 5 * U, lowNear[1] - 9 * U];
  let armsL, armsF;
  const AC = acroState(tl);
  if (tl.move.acro) {
    // él: las dos manos a la cintura de ella · ella: brazos arriba en "V" (se dibujan girados con su cuerpo)
    const g = AC.grip, P = F.pivot;
    const lowN = [(L.shNear[0] + F.shNear[0]) / 2, L.hip[1] - 80 * U * FIG], lowF = [lowN[0] + 5 * U, lowN[1] - 9 * U];
    const tL = { far: lerp2(lowF, add(P, [6 * U, -8 * U]), g), near: lerp2(lowN, add(P, [-4 * U, 9 * U]), g) };
    const upFar = add(F.shFar, [-F.dir * 95 * F.k, -110 * F.k]), upNear = add(F.shNear, [F.dir * 62 * F.k, -122 * F.k]);
    const lowFN = [(L.shNear[0] + F.shNear[0]) / 2, F.hip[1] - 80 * U * FIG], lowFF = [lowFN[0] + 5 * U, lowFN[1] - 9 * U];
    const g2 = ramp(tl.cnt, 3.6, 4.6) * (1 - ramp(tl.cnt, 7.6, 8));   // primero suelta y abre, luego sube los brazos
    const sideFar = add(F.shFar, [-F.dir * 115 * F.k, 25 * F.k]), sideNear = add(F.shNear, [F.dir * 70 * F.k, 60 * F.k]);
    const tF = { far: lerp2(lerp2(lowFF, sideFar, g), upFar, g2), near: lerp2(lerp2(lowFN, sideNear, g), upNear, g2) };
    armsL = { far: arm(L, L.shFar, clampReach(tL.far, L.shFar, L.reach)), near: arm(L, L.shNear, clampReach(tL.near, L.shNear, L.reach)) };
    armsF = { far: arm(F, F.shFar, clampReach(tF.far, F.shFar, F.reach)), near: arm(F, F.shNear, clampReach(tF.near, F.shNear, F.reach)) };
  } else {
    let farHold = lowFar, nearL = lowNear, nearF = lowNear;
    if (tl.move.spin) {
      const X = tl.move.spin === 'L' ? L : F, P = X === L ? F : L;
      const raised = [X.hx + (P.hx - X.hx) * 0.2, X.top - 26 * U * FIG];
      farHold = lerp2(lowFar, raised, r);
      nearL = lerp2(lowNear, L.free(X === L), r);
      nearF = lerp2(lowNear, F.free(X === F), r);
    }
    for (let i = 0; i < 3; i++) { farHold = clampReach(clampReach(farHold, L.shFar, L.reach), F.shFar, F.reach); }
    armsL = { far: arm(L, L.shFar, farHold), near: arm(L, L.shNear, clampReach(nearL, L.shNear, L.reach)) };
    armsF = { far: arm(F, F.shFar, farHold), near: arm(F, F.shNear, clampReach(nearF, F.shNear, F.reach)) };
  }

  drawShadow(L.hx); drawShadow(F.hx, 1 - 0.5 * AC.air, 0.3 - 0.15 * AC.air);
  const figs = [[L, armsL], [F, armsF]];
  for (const [fg, ar] of figs) withRot(fg, () => {    // pasada lejana (más clarita)
    const aFar = 0.74 - 0.22 * Math.abs(fg.s);
    drawLeg(fg.s >= 0 ? fg.legA : fg.legB, aFar, fg.isL);
    drawArm(fg.s >= 0 ? ar.far : ar.near, aFar);
  });
  for (const [fg, ar] of figs) withRot(fg, () => {    // pasada cercana
    const aNear = 0.74 + 0.2 * Math.abs(fg.s);
    drawLeg(fg.s >= 0 ? fg.legB : fg.legA, aNear, fg.isL);
    if (!fg.isL) drawSkirt(fg, aNear);
    pencil([fg.hip, fg.rib, fg.neck], { a: aNear, w: 3.8 });
    drawHead(fg, aNear);
    if (!(fg.isL && AC.grip > 0)) drawArm(fg.s >= 0 ? ar.near : ar.far, aNear);
    drawSwirl(fg);
  });
  if (AC.grip > 0) drawArm(L.s >= 0 ? armsL.near : armsL.far, 0.94);   // sus manos por encima de la falda
  drawFlipLines(F);
  if (CONFIG.notes) drawNotes(tq);
  if (CONFIG.showCounts) drawCounts(tl);
  const top = G - 470 * U * FIG;            // altura del sombrero
  if (CONFIG.title) drawText(CONFIG.title, top - (CONFIG.subtitle ? 150 : 110) * U, 104, 0.9);
  if (CONFIG.subtitle) drawText(CONFIG.subtitle, top - 70 * U, 54, 0.7);
}

window.renderAt = renderAt; window.LOOP_SECONDS = LOOP_SECONDS; window.DRAW_FPS = CONFIG.drawFps;
window.READY = Promise.all([
  (document.fonts ? document.fonts.load(`700 40px ${CONFIG.font}`) : Promise.resolve()).catch(() => {}),
  logoImg.decode().then(buildLogo).catch(() => {}),
]);

// ---- reproducción (toca para pausar). ?capture=1 desactiva el bucle para exportar ----
if (!/capture/.test(location.search)) {
  let paused = false, acc = 0, last = performance.now();
  cv.addEventListener('click', () => { paused = !paused; });
  (function loop(now) { if (!paused) acc += (now - last) / 1000; last = now; renderAt(acc); requestAnimationFrame(loop); })(last);
} else window.READY.then(() => renderAt(0));
</script>
</body>
</html>
